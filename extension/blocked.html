<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Broccoli</title><link rel="stylesheet" href="blocked.css"><script src="blocked.js" defer></script></head>
<body><main><div class="block-summary">
<header class="brand"><img src="icon.svg" alt=""><span>Broccoli</span></header>
<section class="hero"><h1 id="heading">此网站已被拦截</h1><p id="website"></p><p id="details"></p><button id="retry" class="primary">重新检查</button></section>

<div id="options" hidden><button id="rest-options" type="button" class="rest-trigger" aria-haspopup="dialog" aria-controls="rest-popover" aria-expanded="false">休息 <svg class="rest-chevron" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m4.5 6.25 3.5 3.5 3.5-3.5"/></svg></button></div>
<div id="rest-popover" popover="auto" role="dialog" aria-labelledby="rest-title">
<header class="rest-header"><h2 id="rest-title">休息</h2><button id="rest-close" type="button" aria-label="关闭休息选项">×</button></header>
<div class="rest-body"><section id="break-section" hidden><div id="breaks"></div></section><section id="tab-section" hidden><div id="tab-actions"></div></section></div>
<p id="rest-status" role="status" aria-live="polite"></p>
</div>
<p id="error" role="status" aria-live="polite"></p>
</div><section id="agenda" hidden aria-labelledby="agenda-heading"><h2 id="agenda-heading">近三日</h2><div id="agenda-days"></div></section></main></body></html>
