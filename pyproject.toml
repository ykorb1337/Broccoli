[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "broccoli"
version = "0.7.0"
description = "A macOS focus and activity app"
requires-python = ">=3.9"
dependencies = []
license = {file = "LICENSE"}

[project.urls]
Repository = "https://github.com/ykorb1337/Broccoli"
Issues = "https://github.com/ykorb1337/Broccoli/issues"

[project.scripts]
broccoli = "broccoli.cli:main"

[tool.setuptools]
packages = ["broccoli"]
