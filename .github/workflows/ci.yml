name: macOS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python rules, services and IPC
        run: python3 -m unittest discover -s tests -v
      - name: Browser policies and navigation races
        run: python3 scripts/check_frontend.py
      - name: Native build with verified bundled runtime
        run: python3 scripts/build.py --qa --distribution
      - name: Real signed peers and policy RPC
        run: |
          python3 tests/integration_peer.py
          python3 tests/integration_system_package.py
          python3 tests/integration_installation_gate.py
          python3 tests/integration_system_transaction.py
          python3 tests/integration_system_cutover.py
          python3 tests/integration_cutover_crash.py
          python3 tests/integration_service_lease.py
          python3 tests/integration_job_exit.py
          python3 tests/integration_protected_driver.py
          python3 tests/integration_driver_crash.py
          python3 tests/integration_runtime.py
          python3 tests/integration_uninstaller.py
          python3 tests/integration_authority.py
          python3 tests/integration_system_enforcement.py
          python3 tests/integration_device_gate.py
          python3 tests/integration_trusted_sessions.py
          python3 tests/integration_trusted_browsers.py
          python3 tests/integration_management.py
          python3 tests/integration_legacy_documents.py
          python3 tests/integration_system_desktop.py
          python3 tests/integration_session_desktop.py
          python3 tests/integration_session_supervision.py
